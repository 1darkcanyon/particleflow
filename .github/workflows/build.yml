name: Build ParticleFlow
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;25.1.8937393"
          sdkmanager "cmake;3.22.1"

      - name: Compile shaders
        run: |
          sudo apt-get install -y glslang-tools
          SHADER_DIR=app/src/main/shaders
          OUT_DIR=app/src/main/assets/shaders
          mkdir -p "$OUT_DIR"
          glslangValidator -V "$SHADER_DIR/particle_init.comp"   -o "$OUT_DIR/particle_init.spv"
          glslangValidator -V "$SHADER_DIR/particle_update.comp" -o "$OUT_DIR/particle_update.spv"
          glslangValidator -V "$SHADER_DIR/particle_render.vert" -o "$OUT_DIR/particle_render.vert.spv"
          glslangValidator -V "$SHADER_DIR/particle_render.frag" -o "$OUT_DIR/particle_render.frag.spv"

      - name: Build
        run: ./gradlew assembleDebug

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: particleflow-debug
          path: "**/*.apk"
